name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck and build
        working-directory: web
        run: npm run build

  smoke:
    name: Shell smoke (headless Chrome)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/package-lock.json

      - name: Install web
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Install tests
        working-directory: tests
        run: npm ci

      - name: Install Chrome
        working-directory: tests
        run: npx playwright install --with-deps chrome

      - name: Run smoke test
        working-directory: tests
        run: node run-smoke.mjs
