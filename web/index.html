<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="color-scheme" content="dark" />
    <title>Kyro — SNES Port</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e6323c'/%3E%3Cpath d='M10 8h4v7l6-7h5l-7 8 7 8h-5l-6-7v7h-4z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script>
      // Fail fast with a readable message on very old browsers.
      window.addEventListener("error", function (e) {
        var boot = document.getElementById("boot-fatal");
        if (boot && e && e.message) {
          boot.hidden = false;
          boot.textContent = "Erro ao iniciar: " + e.message;
        }
      });
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot__mark" aria-hidden="true"></div>
        <p class="boot__label">Kyro</p>
      </div>
    </div>
    <div id="boot-fatal" class="boot-fatal" hidden></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui">Este aplicativo precisa de JavaScript.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
